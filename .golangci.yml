run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goimports
    - revive
    - misspell
    - unconvert
    - unparam

linters-settings:
  revive:
    rules:
      - name: exported
      - name: unexported-return
      - name: error-return
      - name: error-strings
  goimports:
    local-prefixes: github.com/ignatij/spotpilot

issues:
  exclude-rules:
    # Test files: relax errcheck (common to ignore errors in test helpers).
    - path: _test\.go
      linters:
        - errcheck
        - unparam
